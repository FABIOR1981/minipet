<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Deshabilita el zoom táctil molesto en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Mascota</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b388ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">

  <!-- Iconos SVG propios: rellenos y gorditos, toman el color de su botón (currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-comer" viewBox="0 0 24 24"><path d="M2 11h20a10 10 0 0 1-20 0z"/><path d="M8.5 7.5c-1-1.2 1-2.3 0-3.5M12 7.5c-1-1.2 1-2.3 0-3.5M15.5 7.5c-1-1.2 1-2.3 0-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-medicina" viewBox="0 0 24 24"><path d="M9 3.5A1.5 1.5 0 0 1 10.5 2h3A1.5 1.5 0 0 1 15 3.5V9h5.5a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5H15v5.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20.5V15H3.5A1.5 1.5 0 0 1 2 13.5v-3A1.5 1.5 0 0 1 3.5 9H9z"/></symbol>
    <symbol id="i-dormir" viewBox="0 0 24 24"><path d="M20.5 14.8A9 9 0 0 1 9.2 3.5a9 9 0 1 0 11.3 11.3z"/><path d="M17 2.5l.9 2.1 2.1.9-2.1.9L17 8.500l-.9-2.1-2.1-.9 2.1-.9z"/></symbol>
    <symbol id="i-juegos" viewBox="0 0 24 24"><rect x="1.500" y="6.500" width="21" height="11.500" rx="5.750"/><path d="M7 10v4.500M4.750 12.250h4.500" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.500" cy="13.750" r="1.300" fill="#fff"/><circle cx="18.500" cy="10.750" r="1.300" fill="#fff"/></symbol>
    <symbol id="i-mipet" viewBox="0 0 24 24"><ellipse cx="12" cy="16.500" rx="5.500" ry="4.500"/><ellipse cx="4.800" cy="11" rx="2.100" ry="2.600"/><ellipse cx="9" cy="6" rx="2.200" ry="2.800"/><ellipse cx="15" cy="6" rx="2.200" ry="2.800"/><ellipse cx="19.200" cy="11" rx="2.100" ry="2.600"/></symbol>
    <symbol id="i-armario" viewBox="0 0 24 24"><path d="M8.500 3 3 5.800a1 1 0 0 0-.4 1.300l1.600 3.200a1 1 0 0 0 1.200.5L7 10.300V20a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-9.700l1.600.5a1 1 0 0 0 1.200-.5l1.600-3.200a1 1 0 0 0-.4-1.300L15.500 3a3.500 3.500 0 0 1-7 0z"/></symbol>
    <symbol id="i-escenario" viewBox="0 0 24 24"><path d="M11.300 2.800a1 1 0 0 1 1.400 0l8.900 8.400a.8.8 0 0 1-.6 1.400H20V20a1.500 1.500 0 0 1-1.500 1.500h-13A1.500 1.500 0 0 1 4 20v-7.400H3a.8.8 0 0 1-.6-1.400z"/><rect x="10" y="14.500" width="4" height="7" rx="1" fill="#fff"/></symbol>
    <symbol id="i-tienda" viewBox="0 0 24 24"><path d="M5 8.500h14l1.200 11a1.500 1.500 0 0 1-1.500 1.700H5.300a1.500 1.500 0 0 1-1.500-1.700z"/><path d="M8.500 8.500V7a3.500 3.500 0 0 1 7 0v1.500" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8.500" cy="11.800" r="1" fill="#fff"/><circle cx="15.500" cy="11.800" r="1" fill="#fff"/></symbol>
    <symbol id="i-hambre" viewBox="0 0 24 24"><path d="M2 8h20a10 10 0 0 1-20 0z"/></symbol>
    <symbol id="i-felicidad" viewBox="0 0 24 24"><path d="M12 21s-9-5.500-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.500-9 12-9 12z"/></symbol>
    <symbol id="i-energia" viewBox="0 0 24 24"><path d="M13.500 2 4 13.500h6.500L9.500 22 20 10h-6.800z"/></symbol>
    <symbol id="i-moneda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.200" fill="none" stroke="#fff" stroke-width="1.6" opacity=".85"/></symbol>
    <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"/></symbol>
    <symbol id="i-listo" viewBox="0 0 24 24"><path d="M4.500 12.500l5 5L19.500 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"/></symbol>
    <symbol id="i-guardar" viewBox="0 0 24 24"><path d="M6 4.500A2.500 2.500 0 0 1 8.500 2h7A2.500 2.500 0 0 1 18 4.500v16a1 1 0 0 1-1.600.8L12 18l-4.400 3.300A1 1 0 0 1 6 20.500z"/></symbol>
    <symbol id="i-repetir" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.200-5.100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8"/><path d="M20 2.500V8h-5.500z"/></symbol>
    <symbol id="i-trofeo" viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3.500 4M17 5h3a3 3 0 0 1-3.500 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11 13.500h2V18h-2z"/><rect x="7.500" y="18" width="9" height="3" rx="1"/></symbol>
  </svg>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/escenarios.css">
  <link rel="stylesheet" href="css/mascota.css">
  <link rel="stylesheet" href="css/juegos.css">
  <link rel="stylesheet" href="css/vestidor.css">
</head>
<body>
  <div id="app-container">
    <!-- Barra Superior -->
    <header class="top-bar">
      <!-- Mismo orden y mismas columnas que la primera fila de botones:
           hambre sobre Comer, felicidad sobre Medicina, energía sobre Dormir
           y monedas sobre Juegos -->
      <div class="stat-box"><svg class="ico ico-hambre" aria-hidden="true"><use href="#i-hambre"/></svg><span class="stat-val"><span id="hunger-count">100</span>%</span></div>
      <div class="stat-box"><svg class="ico ico-felicidad" aria-hidden="true"><use href="#i-felicidad"/></svg><span class="stat-val"><span id="happy-count">100</span>%</span></div>
      <div class="stat-box"><svg class="ico ico-energia" aria-hidden="true"><use href="#i-energia"/></svg><span class="stat-val"><span id="energy-count">100</span>%</span></div>
      <div class="stat-box"><svg class="ico ico-moneda" aria-hidden="true"><use href="#i-moneda"/></svg><span id="coin-count">500</span></div>
    </header>

    <!-- Globo de Pensamiento -->
    <div id="pet-thought" class="thought-bubble">Hola, ¿jugamos?</div>

    <!-- Escenario Principal -->
    <main id="pet-room" class="room">
      <div id="scene-fx" aria-hidden="true"></div>
      <div id="bg-particles"></div>
      <div id="pet-shadow" class="pet-shadow" aria-hidden="true"></div>
      <div id="pet" class="pet-sprite" onclick="PetState.petPet()">
        <div id="pet-glitter" class="pet-glitter" aria-hidden="true"></div>
        <!-- Accesorio Equipado -->
        <div id="pet-accessory" class="accessory"></div>

        <!-- Cara Kawaii Modular -->
        <div class="kawaii-face" id="kawaii-face">
          <div class="eyebrows">
            <div class="eyebrow left"></div>
            <div class="eyebrow right"></div>
          </div>
          <div class="eyes">
            <div class="eye left"><div class="sparkle">★</div></div>
            <div class="eye right"><div class="sparkle">★</div></div>
          </div>
          <div class="cheeks">
            <div class="cheek left"></div>
            <div class="cheek right"></div>
          </div>
          <div class="mouth">:3</div>
          <div id="extra-prop" class="extra-prop"></div>
        </div>
      </div>
      <div id="night-overlay" aria-hidden="true"></div>
      <div id="test-badge" class="test-badge" hidden>🧪 Modo prueba</div>
    </main>

    <!-- Menú Inferior en Rejilla 4x2 -->
    <nav class="bottom-nav">
      <button class="nav-comer" onclick="PetState.feed()">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-comer"/></svg></span>
        <span class="btn-text">Comer</span>
      </button>
      <button class="nav-medicina" onclick="PetState.heal()">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-medicina"/></svg></span>
        <span class="btn-text">Medicina</span>
      </button>
      <button class="nav-dormir" onclick="PetState.sleep()">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-dormir"/></svg></span>
        <span class="btn-text">Dormir</span>
      </button>
      <button class="nav-juegos" onclick="switchTab('minigames')">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-juegos"/></svg></span>
        <span class="btn-text">Juegos</span>
      </button>
      <button class="nav-mipet" onclick="switchTab('my-pet')">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-mipet"/></svg></span>
        <span class="btn-text">Mi Pet</span>
      </button>
      <button class="nav-armario" onclick="Vestidor.open()">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-armario"/></svg></span>
        <span class="btn-text">Armario</span>
      </button>
      <button class="nav-escenario" onclick="switchTab('scenery')">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-escenario"/></svg></span>
        <span class="btn-text">Escenario</span>
      </button>
      <button class="nav-tienda" onclick="switchTab('store')">
        <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-tienda"/></svg></span>
        <span class="btn-text">Tienda</span>
      </button>
    </nav>

    <!-- Panel del vestidor: reemplaza a la botonera mientras la mascota se prueba cosas -->
    <section id="vestidor-panel" class="vestidor-panel" hidden>
      <div class="vestidor-head">
        <span class="vestidor-title con-ico"><svg class="ico ico-armario" aria-hidden="true"><use href="#i-armario"/></svg><span id="vestidor-title">Vestidor</span></span>
        <button class="vestidor-done con-ico" onclick="Vestidor.close()"><svg class="ico" aria-hidden="true"><use href="#i-listo"/></svg>Listo</button>
      </div>
      <div id="vestidor-strip" class="vestidor-strip"></div>
      <div class="vestidor-looks">
        <div id="vestidor-looks-list"></div>
        <button class="vestidor-save con-ico" onclick="Vestidor.saveLook()"><svg class="ico" aria-hidden="true"><use href="#i-guardar"/></svg>Guardar look</button>
      </div>
    </section>

    <!-- Modales -->
    <section id="modal-screen" class="modal hidden">
      <button class="close-btn con-ico" onclick="closeModal()"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg>Cerrar</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <script src="js/iconos.js"></script>
  <script src="js/mascota-estado.js"></script>
  <script src="js/mascota-visual.js"></script>
  <script src="js/particulas.js"></script>
  <script src="js/ambiente.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/tienda.js"></script>
  <script src="js/juegos/juegos-base.js"></script>
  <script src="js/juegos/mascota-mini.js"></script>
  <script src="js/juegos/atrapa-dulces.js"></script>
  <script src="js/juegos/explota-globos.js"></script>
  <script src="js/juegos/torre-postres.js"></script>
  <script src="js/juegos/simon-memoria.js"></script>
  <script src="js/juegos/runner-magico.js"></script>
  <script src="js/juegos/burbujas-magicas.js"></script>
  <script src="js/juegos/parejas.js"></script>
  <script src="js/juegos/donde-esta.js"></script>
  <script src="js/juegos/vestir-igual.js"></script>
  <script src="js/juegos/lluvia-comida.js"></script>
  <script src="js/vestidor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
