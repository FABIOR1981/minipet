    <symbol id="i-guardar" viewBox="0 0 24 24"><path d="M6 4.500A2.500 2.500 0 0 1 8.500 2h7A2.500 2.500 0 0 1 18 4.500v16a1 1 0 0 1-1.600.8L12 18l-4.400 3.300A1 1 0 0 1 6 20.500z"/></symbol>
    <symbol id="i-repetir" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.200-5.100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8"/><path d="M20 2.500V8h-5.500z"/></symbol>
    <symbol id="i-trofeo" viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3.500 4M17 5h3a3 3 0 0 1-3.500 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11 13.500h2V18h-2z"/><rect x="7.500" y="18" width="9" height="3" rx="1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><rect x="3" y="3" width="7.500" height="7.500" rx="2.200"/><rect x="13.500" y="3" width="7.500" height="7.500" rx="2.200"/><rect x="3" y="13.500" width="7.500" height="7.500" rx="2.200"/><rect x="13.500" y="13.500" width="7.500" height="7.500" rx="2.200"/></symbol>
    <symbol id="i-toque" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.500"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.200" opacity=".55"/></symbol>

    <!-- Íconos de los minijuegos (reemplazan a los emojis del menú) -->
    <symbol id="i-juego-atrapa" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="6.500" ry="7.500"/><path d="M10.800 16.300h2.400L12 18.500z"/><path d="M12 18.500c-1 1.300 1 2.200 0 3.500" fill="none" stroke="currentColor" stroke-width="1.300" stroke-linecap="round"/></symbol>
    <symbol id="i-juego-globos" viewBox="0 0 24 24"><circle cx="12" cy="6.500" r="3.500"/><circle cx="7" cy="10.500" r="3.500"/><circle cx="17" cy="10.500" r="3.500"/><circle cx="8.500" cy="15.500" r="3.500"/><circle cx="15.500" cy="15.500" r="3.500"/><circle cx="12" cy="12" r="2.200" fill="#fff"/></symbol>
    <symbol id="i-juego-torre" viewBox="0 0 24 24"><rect x="3" y="15" width="18" height="5" rx="2"/><rect x="5" y="10" width="14" height="4.500" rx="2"/><rect x="7" y="5.500" width="10" height="4" rx="2"/><circle cx="12" cy="3.500" r="1.800"/></symbol>

    <symbol id="i-juego-burbujas" viewBox="0 0 24 24"><circle cx="9" cy="14" r="6"/><circle cx="18" cy="6" r="3"/><circle cx="19" cy="17" r="2"/></symbol>
    <symbol id="i-juego-parejas" viewBox="0 0 24 24"><rect x="2" y="5" width="13" height="17" rx="2.500" opacity=".55"/><rect x="9" y="2" width="13" height="17" rx="2.500"/><path d="M15.500 6.500l1.500 2.800 2.800 1.500-2.800 1.500-1.500 2.800-1.500-2.800-2.800-1.500 2.800-1.500z" fill="#fff"/></symbol>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/escenarios.css">
  <link rel="stylesheet" href="css/mascota.css">
  <link rel="stylesheet" href="css/juegos.css">
  <link rel="stylesheet" href="css/vestidor.css">
</head>
<body>
  <div id="app-container">
    <!-- Marca -->
    <div class="brand-bar" aria-label="MiPetKawaii">
      <span class="brand-heart" aria-hidden="true">💗</span>
      <span class="brand-name">MiPetKawaii</span>
    </div>

    <!-- Barra Superior -->
    <header class="top-bar">
      <!-- Mismo orden y mismas columnas que la primera fila de botones:
           hambre sobre Comer, felicidad sobre Medicina, energía sobre Dormir
           y monedas sobre Juegos -->
      <div class="stat-box"><svg class="ico ico-hambre" aria-hidden="true"><use href="#i-hambre"/></svg><span class="stat-val"><span id="hunger-count">100</span>%</span></div>
      <div class="stat-box"><svg class="ico ico-felicidad" aria-hidden="true"><use href="#i-felicidad"/></svg><span class="stat-val"><span id="happy-count">100</span>%</span></div>
      <div class="stat-box"><svg class="ico ico-energia" aria-hidden="true"><use href="#i-energia"/></svg><span class="stat-val"><span id="energy-count">100</span>%</span></div>
      <div class="stat-box"><svg class="ico ico-moneda" aria-hidden="true"><use href="#i-moneda"/></svg><span id="coin-count">500</span></div>
    </header>

    <!-- Globo de Pensamiento -->
    <div id="pet-thought" class="thought-bubble">Hola, ¿jugamos?</div>

    <!-- Escenario Principal -->
    <main id="pet-room" class="room">
      <div id="scene-fx" aria-hidden="true"></div>
      <div id="bg-particles"></div>
      <div id="pet-shadow" class="pet-shadow" aria-hidden="true"></div>
      <div id="pet" class="pet-sprite" data-action="pet">
        <div id="pet-glitter" class="pet-glitter" aria-hidden="true"></div>
        <!-- Accesorio Equipado -->
        <div id="pet-accessory" class="accessory"></div>

        <!-- Cara Kawaii Modular -->
        <div class="kawaii-face" id="kawaii-face">
          <div class="eyebrows">
            <div class="eyebrow left"></div>
            <div class="eyebrow right"></div>
          </div>
          <div class="eyes">
            <div class="eye left"><div class="sparkle">★</div></div>
            <div class="eye right"><div class="sparkle">★</div></div>
          </div>
          <div class="cheeks">
            <div class="cheek left"></div>
            <div class="cheek right"></div>
          </div>
          <div class="mouth">:3</div>
          <div id="extra-prop" class="extra-prop"></div>
        </div>
      </div>
      <div id="night-overlay" aria-hidden="true"></div>
      <div id="test-badge" class="test-badge" hidden>🧪 Modo prueba</div>
    </main>

    <!-- Menú inferior en dos grupos: cuidar y jugar, personalizar -->
    <nav class="bottom-nav">
      <div class="nav-grupo">
        <span class="nav-grupo-titulo">Cuidar y jugar</span>
        <div class="nav-grupo-botones">
        <button class="nav-comer" data-action="comer">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-comer"/></svg></span>
          <span class="btn-text">Comer</span>
        </button>
        <button class="nav-medicina" data-action="medicina">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-medicina"/></svg></span>
          <span class="btn-text">Medicina</span>
        </button>
        <button class="nav-dormir" data-action="dormir">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-dormir"/></svg></span>
          <span class="btn-text">Dormir</span>
        </button>
        <button class="nav-juegos" data-action="juegos">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-juegos"/></svg></span>
          <span class="btn-text">Juegos</span>
        </button>
        </div>
      </div>
      <div class="nav-grupo">
        <span class="nav-grupo-titulo">Personalizar</span>
        <div class="nav-grupo-botones">
        <button class="nav-mipet" data-action="mi-pet">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-mipet"/></svg></span>
          <span class="btn-text">Mi Pet</span>
        </button>
        <button class="nav-armario" data-action="armario">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-armario"/></svg></span>
          <span class="btn-text">Armario</span>
        </button>
        <button class="nav-escenario" data-action="escenario">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-escenario"/></svg></span>
          <span class="btn-text">Escenario</span>
        </button>
        <button class="nav-tienda" data-action="tienda">
          <span class="btn-icon"><svg class="ico" aria-hidden="true"><use href="#i-tienda"/></svg></span>
          <span class="btn-text">Tienda</span>
        </button>
        </div>
      </div>
    </nav>

    <!-- Panel del vestidor: reemplaza a la botonera mientras la mascota se prueba cosas -->
    <section id="vestidor-panel" class="vestidor-panel" hidden>
      <div class="vestidor-head">
        <span class="vestidor-title con-ico"><svg class="ico ico-armario" aria-hidden="true"><use href="#i-armario"/></svg><span id="vestidor-title">Vestidor</span></span>
        <span id="vestidor-estilista" class="vestidor-estilista" aria-hidden="true"></span>
        <button class="vestidor-done con-ico" data-action="vestidor-cerrar"><svg class="ico" aria-hidden="true"><use href="#i-listo"/></svg>Listo</button>
      </div>
      <div id="vestidor-strip" class="vestidor-strip"></div>
      <div class="vestidor-looks">
        <div id="vestidor-looks-list"></div>
        <button class="vestidor-save con-ico" data-action="vestidor-guardar-look"><svg class="ico" aria-hidden="true"><use href="#i-guardar"/></svg>Guardar look</button>
      </div>
    </section>

    <!-- Modales -->
    <section id="modal-screen" class="modal hidden">
      <button class="close-btn con-ico" data-action="cerrar-modal"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg>Cerrar</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
