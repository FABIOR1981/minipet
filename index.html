<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mascota Virtual</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="app-container">
    <!-- Barra Superior de Estadísticas -->
    <div class="top-bar">
      <div class="stat-box">🪙 <span id="coin-count">100</span></div>
      <div class="stat-box">❤️ <span id="happy-count">100</span></div>
      <div class="stat-box">🍕 <span id="hunger-count">100</span></div>
      <div class="stat-box">⚡ <span id="energy-count">100</span></div>
    </div>

    <!-- Globo de Pensamiento -->
    <div id="pet-thought" class="thought-bubble">❤️ ¡Hola!</div>

    <!-- Escenario Principal / Habitación -->
    <div id="pet-room" class="room bg_living">
      <div id="pet" class="pet-sprite" onclick="PetState.petPet()">
        <div id="kawaii-face" class="kawaii-face happy">
          <div class="eyes">
            <div class="eye"><span class="sparkle">✨</span></div>
            <div class="eye"><span class="sparkle">✨</span></div>
          </div>
          <div class="cheeks">
            <div class="cheek"></div>
            <div class="cheek"></div>
          </div>
          <div class="mouth">w</div>
          <div id="extra-prop" class="extra-prop"></div>
        </div>
        <div id="pet-accessory" class="accessory"></div>
      </div>
    </div>

    <!-- Barra de Navegación Inferior -->
    <div class="bottom-nav">
      <button onclick="PetState.feed()">
        <span class="btn-icon">🍕</span>
        <span class="btn-text">Comer</span>
      </button>
      <button onclick="PetState.heal()">
        <span class="btn-icon">💊</span>
        <span class="btn-text">Medicina</span>
      </button>
      <button onclick="PetState.sleep()">
        <span class="btn-icon">🌙</span>
        <span class="btn-text">Dormir</span>
      </button>
      <button onclick="switchTab('wardrobe')">
        <span class="btn-icon">🎒</span>
        <span class="btn-text">Armario</span>
      </button>
      <button onclick="switchTab('store')">
        <span class="btn-icon">🛍️</span>
        <span class="btn-text">Tienda</span>
      </button>
      <button onclick="switchTab('minigames')">
        <span class="btn-icon">🎮</span>
        <span class="btn-text">Juegos</span>
      </button>
    </div>

    <!-- Ventana Modal para Tienda / Armario / Juegos -->
    <div id="modal-overlay" class="modal hidden">
      <button class="close-btn" onclick="switchTab('close')">❌ Cerrar</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Carga de Scripts en Orden Estricto -->
  <script src="js/audio.js"></script>
  <script src="js/store.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
