  <polygon points="114,24 105,4 92,17" fill="#e1bee7" stroke="#ba68c8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Auriculares: quedan a los costados, a la altura de los ojos -->
  <rect x="2" y="44" width="26" height="44" rx="12" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2"/>
  <rect x="14" y="52" width="9" height="28" rx="4.5" fill="#ea80fc"/>
  <rect x="122" y="44" width="26" height="44" rx="12" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2"/>
  <rect x="127" y="52" width="9" height="28" rx="4.5" fill="#ea80fc"/>
</svg>
